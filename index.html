<!doctype html>
<html lang="fa" dir="rtl" data-theme="purple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c12">
  <title>Rz Station</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon48.png">
  <link rel="apple-touch-icon" href="icon192.png">
  <link rel="stylesheet" href="glass.css?v=12">
  <link rel="stylesheet" href="app.css?v=12">
</head>
<body>
  <div class="wrap">
    <header class="appbar glass fade-in">
      <h1 class="brand" aria-label="Rz Station">
        <svg class="logo" viewBox="0 0 36 36" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" style="stop-color: var(--accent)"></stop>
              <stop offset="1" style="stop-color: #ff72b6"></stop>
            </linearGradient>
          </defs>
          <rect width="36" height="36" rx="11" fill="url(#lg)"></rect>
          <rect class="bar b1" x="8"  y="10" width="4" height="16" rx="2" fill="#fff"></rect>
          <rect class="bar b2" x="15" y="6"  width="4" height="24" rx="2" fill="#fff"></rect>
          <rect class="bar b3" x="22" y="12" width="4" height="12" rx="2" fill="#fff"></rect>
        </svg>
        <span class="wordmark" dir="ltr"><b>Rz</b><span>Station</span></span>
      </h1>
      <div class="bar-actions">
        <button id="connBadge" class="badge" type="button" data-i18n-title="badgeTitle">…</button>
        <button id="langBtn" class="badge langbtn" type="button" aria-label="Language / زبان" title="Language / زبان">EN</button>
      </div>
    </header>

    <!-- ======== Search ======== -->
    <section id="view-search" class="view">
      <form id="searchForm" class="searchbar glass fade-in">
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <button class="glass-button go" type="submit" data-i18n="search">…</button>
      </form>
      <div class="seg modeseg" role="radiogroup" data-i18n-aria="modeLabel">
        <button id="modeFree" class="seg-btn" type="button" role="radio" aria-checked="true" data-i18n="modeFree">…</button>
        <button id="modeOriginal" class="seg-btn" type="button" role="radio" aria-checked="false" data-i18n="modeOriginal">…</button>
      </div>
      <div id="provSeg" class="seg modeseg" role="radiogroup" data-i18n-aria="provLabel" hidden>
        <button id="provYt" class="seg-btn" type="button" role="radio" aria-checked="true">YouTube</button>
        <button id="provSp" class="seg-btn" type="button" role="radio" aria-checked="false">Spotify</button>
      </div>
      <p id="modeHint" class="hint"></p>
      <div id="chips" class="chips" data-i18n-aria="chipsLabel"></div>

      <details class="linkbox glass" id="linkBox">
        <summary data-i18n="linkSummary">…</summary>
        <form id="linkForm">
          <input id="linkInput" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="linkPh">
          <button class="glass-button" type="submit" data-i18n="play">…</button>
        </form>
      </details>

      <p id="status" role="status"></p>
      <section id="results" aria-live="polite"></section>

      <section id="tracksBox" class="glass fade-in" hidden>
        <div class="tracks-head">
          <h2 id="itemTitle"></h2>
          <button id="dlAll" class="glass-button" type="button" data-i18n="downloadAll">…</button>
        </div>
        <ol id="tracks"></ol>
      </section>
    </section>

    <!-- ======== Radio ======== -->
    <section id="view-radio" class="view" hidden>
      <div class="head"><h2 data-i18n="radio">…</h2></div>

      <div class="card glass">
        <div class="switch-row">
          <h3 data-i18n="radioSwitchLabel">…</h3>
          <button id="radioSwitch" class="switch" type="button" role="switch" aria-checked="false" data-i18n-aria="radioSwitchLabel"></button>
        </div>
        <p class="hint" data-i18n="radioHint">…</p>
      </div>

      <div class="card glass">
        <h3 data-i18n="radioSourceTitle">…</h3>
        <div class="seg" role="radiogroup" data-i18n-aria="radioSourceTitle">
          <button id="srcJamendo" class="seg-btn" type="button" role="radio" aria-checked="false">Jamendo</button>
          <button id="srcArchive" class="seg-btn" type="button" role="radio" aria-checked="false">Internet Archive</button>
        </div>
        <p id="radioSourceHint" class="hint"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="radioStyleTitle">…</h3>
        <div id="radioNow" class="radio-now"></div>
        <div id="radioTags" class="chips"></div>
        <p id="radioMode" class="hint"></p>
        <div class="row">
          <button id="radioNextBtn" class="glass-button" type="button" data-i18n="radioNextBtn">…</button>
          <button id="radioAutoBtn" class="glass-button" type="button" data-i18n="radioAutoBtn" hidden>…</button>
        </div>
        <p id="radioStatus" class="hint state" role="status"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="radioStations">…</h3>
        <div id="radioStations" class="chips"></div>
      </div>

      <div class="card glass">
        <h3 data-i18n="radioRecent">…</h3>
        <p id="radioPicksEmpty" class="hint" data-i18n="radioPicksEmpty">…</p>
        <div id="radioPicks"></div>
      </div>
    </section>

    <!-- ======== Favorites ======== -->
    <section id="view-favorites" class="view" hidden>
      <div class="head">
        <h2 data-i18n="favorites">…</h2>
        <button id="playAllFavs" class="glass-button mini" type="button" data-i18n="playAll">…</button>
      </div>
      <p id="favsEmpty" class="empty glass" data-i18n="favsEmpty">…</p>
      <div id="favsList"></div>
    </section>

    <!-- ======== History ======== -->
    <section id="view-history" class="view" hidden>
      <div class="head">
        <h2 data-i18n="history">…</h2>
        <button id="clearHistory" class="glass-button mini" type="button" data-i18n="clearAll">…</button>
      </div>
      <p id="historyEmpty" class="empty glass" data-i18n="historyEmpty">…</p>
      <div id="historyList"></div>
    </section>

    <!-- ======== Settings ======== -->
    <section id="view-settings" class="view" hidden>
      <div class="head"><h2 data-i18n="settings">…</h2></div>

      <div class="card glass">
        <h3 data-i18n="proxyTitle">…</h3>
        <p class="hint" data-i18n="proxyHint">…</p>
        <form id="proxyForm">
          <input id="proxyInput" type="text" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="proxyPh">
          <div class="row">
            <button class="glass-button" type="submit" data-i18n="save">…</button>
            <button class="glass-button" id="proxyTest" type="button" data-i18n="testConn">…</button>
            <button class="glass-button" id="proxyClear" type="button" data-i18n="remove">…</button>
          </div>
        </form>
        <p id="proxyMsg" class="hint state"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="jamTitle">…</h3>
        <p class="hint" data-i18n-html="jamHint">…</p>
        <form id="jamForm">
          <input id="jamInput" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="jamPh">
          <div class="row">
            <button class="glass-button" type="submit" data-i18n="save">…</button>
            <button class="glass-button" id="jamTest" type="button" data-i18n="testConn">…</button>
            <button class="glass-button" id="jamClear" type="button" data-i18n="remove">…</button>
          </div>
        </form>
        <p id="jamMsg" class="hint state"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="ytTitle">…</h3>
        <p class="hint" data-i18n-html="ytHint">…</p>
        <form id="ytForm">
          <input id="ytInput" type="text" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="ytPh">
          <div class="row">
            <button class="glass-button" type="submit" data-i18n="save">…</button>
            <button class="glass-button" id="ytTest" type="button" data-i18n="testConn">…</button>
            <button class="glass-button" id="ytClear" type="button" data-i18n="remove">…</button>
          </div>
        </form>
        <p id="ytMsg" class="hint state"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="spTitle">…</h3>
        <p class="hint" data-i18n="spHint">…</p>
        <p id="spStatus" class="hint state"></p>
        <div class="row">
          <button class="glass-button" id="spConnect" type="button" data-i18n="spConnect">…</button>
          <button class="glass-button" id="spLogout" type="button" data-i18n="spLogout" hidden>…</button>
        </div>
        <p id="spMsg" class="hint state"></p>
      </div>

      <div class="card glass">
        <h3 data-i18n="langTitle">…</h3>
        <div class="row">
          <button class="glass-button" id="langFa" type="button">فارسی</button>
          <button class="glass-button" id="langEn" type="button">English</button>
        </div>
      </div>

      <div class="card glass">
        <h3 data-i18n="themeTitle">…</h3>
        <div class="themes" id="themes"></div>
      </div>

      <div class="card glass">
        <h3 data-i18n="dataTitle">…</h3>
        <p class="hint" data-i18n="dataHint">…</p>
        <div class="row">
          <button class="glass-button" id="clearSearches" type="button" data-i18n="clearSearches">…</button>
          <button class="glass-button" id="clearHistory2" type="button" data-i18n="clearHistory">…</button>
        </div>
      </div>

      <div class="card glass">
        <h3 data-i18n="helpTitle">…</h3>
        <p class="hint" data-i18n-html="helpHint">…</p>
      </div>
    </section>
  </div>

  <!-- ======== Player ======== -->
  <footer id="player" class="glass glow" hidden>
    <div class="np-row">
      <div class="np">
        <div id="nowPlaying">—</div>
        <div id="nowAlbum"></div>
      </div>
      <button id="radioToggle" class="glass-button mini radio-toggle" type="button" aria-pressed="false" data-i18n-title="radioToggleTitle" data-i18n-aria="radioToggleTitle">📻</button>
    </div>
    <audio id="audio" controls preload="none"></audio>
    <div class="ctrl">
      <button id="prev" class="glass-button" type="button" data-i18n-aria="prev">⏮</button>
      <button id="favNow" class="glass-button heart" type="button">♡</button>
      <button id="dlNow" class="glass-button" type="button" data-i18n="dlNow">…</button>
      <button id="embedReopen" class="glass-button" type="button" data-i18n="embedReopen" hidden>…</button>
      <button id="shareNow" class="glass-button" type="button" data-i18n="shareNow">…</button>
      <button id="next" class="glass-button" type="button" data-i18n-aria="next">⏭</button>
    </div>
  </footer>

  <nav id="tabs" class="glass" data-i18n-aria="tabsLabel">
    <button type="button" data-view="search" class="tab on"><span class="ic">🔎</span><span data-i18n="tabSearch">…</span></button>
    <button type="button" data-view="radio" class="tab"><span class="ic">📻</span><span data-i18n="tabRadio">…</span></button>
    <button type="button" data-view="favorites" class="tab"><span class="ic">❤</span><span data-i18n="tabFavorites">…</span></button>
    <button type="button" data-view="history" class="tab"><span class="ic">🕘</span><span data-i18n="tabHistory">…</span></button>
    <button type="button" data-view="settings" class="tab"><span class="ic">⚙</span><span data-i18n="tabSettings">…</span></button>
  </nav>

  <!-- ======== Original-song player (official embed) ======== -->
  <div id="embedSheet" class="sheet" hidden>
    <div class="sheet-box glass" role="dialog" aria-modal="true" aria-labelledby="embedTitle">
      <h3 id="embedTitle"></h3>
      <div id="embedSub" class="share-name"></div>
      <div id="embedFrame" class="embed-frame"></div>
      <p id="embedNote" class="hint"></p>
      <div class="row">
        <button id="embedFav" class="glass-button heart" type="button">♡</button>
        <button id="embedShare" class="glass-button" type="button" data-i18n="shareNow">…</button>
        <a id="embedOpen" class="glass-button linkbtn" target="_blank" rel="noopener noreferrer" data-i18n="openSource">…</a>
        <button id="embedClose" class="glass-button" type="button" data-i18n="close">…</button>
      </div>
    </div>
  </div>

  <!-- ======== Share sheet ======== -->
  <div id="shareSheet" class="sheet" hidden>
    <div class="sheet-box glass" role="dialog" aria-modal="true" aria-labelledby="shareHead">
      <h3 id="shareHead" data-i18n="shareTitle">…</h3>
      <div id="shareName" class="share-name"></div>
      <input id="shareLink" type="text" readonly dir="ltr" spellcheck="false" aria-label="Link">
      <p id="shareMsg" class="hint state" role="status"></p>
      <div class="row">
        <button id="shareCopy" class="glass-button" type="button" data-i18n="copy">…</button>
        <button id="shareVia" class="glass-button" type="button" data-i18n="shareVia">…</button>
        <button id="shareClose" class="glass-button" type="button" data-i18n="close">…</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=12"></script>
</body>
</html>
