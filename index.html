<!doctype html>
<html lang="fa" dir="rtl" data-theme="purple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c12">
  <title>پلیر موزیک</title>
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon48.png">
  <link rel="apple-touch-icon" href="icon192.png">
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="wrap">
    <header class="top glass fade-in">
      <div class="top-row">
        <h1>🎵 پلیر موزیک</h1>
        <div class="themes" id="themes" aria-label="تم رنگی"></div>
      </div>
      <form id="searchForm">
        <input id="q" type="search" placeholder="جستجوی آهنگ، خواننده یا آلبوم…" autocomplete="off">
        <button class="glass-button" type="submit">جستجو</button>
      </form>
      <form id="linkForm">
        <input id="linkInput" type="url" dir="ltr" placeholder="لینک آهنگ یا صفحه archive.org را بچسبانید">
        <button class="glass-button" type="submit">پخش لینک</button>
      </form>
    </header>

    <main>
      <section id="results" aria-live="polite"></section>
      <section id="tracksBox" class="glass fade-in" hidden>
        <div class="tracks-head">
          <h2 id="itemTitle"></h2>
          <button id="dlAll" class="glass-button" type="button">دانلود همه</button>
        </div>
        <ol id="tracks"></ol>
      </section>
      <p id="status"></p>
    </main>
  </div>

  <footer id="player" class="glass fade-in glow" hidden>
    <div id="nowPlaying">—</div>
    <audio id="audio" controls preload="none"></audio>
    <div class="ctrl">
      <button id="prev" class="glass-button" type="button">⏮ قبلی</button>
      <button id="dlNow" class="glass-button" type="button">⬇ دانلود</button>
      <button id="next" class="glass-button" type="button">بعدی ⏭</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
